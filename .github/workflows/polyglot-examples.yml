name: Optional polyglot examples
on:
  workflow_dispatch:
    inputs:
      language:
        description: Language example to run
        type: choice
        options: [all, java, typescript, python, php, scala]
        default: all
      base_ref:
        description: Explicit comparison commit or ref for scoped changed-line coverage
        required: true
        type: string
      threshold:
        description: Reference-app chosen changed-line percentage (0-100)
        default: '90'
        required: true
        type: string
permissions:
  contents: read
jobs:
  examples:
    name: Advisory language examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POLYGLOT_LANGUAGE: ${{ inputs.language }}
      POLYGLOT_BASE: ${{ inputs.base_ref }}
      POLYGLOT_THRESHOLD: ${{ inputs.threshold }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 scripts/polyglot.py setup --language "$POLYGLOT_LANGUAGE"
      - run: python3 -m unittest discover -s scripts/tests
      - run: python3 scripts/polyglot.py check --language "$POLYGLOT_LANGUAGE" --base "$POLYGLOT_BASE" --threshold "$POLYGLOT_THRESHOLD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          include-hidden-files: true
          if-no-files-found: error
          name: advisory-polyglot-evidence
          path: |
            .artifacts/polyglot/results.json
            .artifacts/polyglot/*.log
          retention-days: 14
