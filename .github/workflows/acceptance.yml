name: Acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: Application acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record hook / invocation
        id: checkpoint_context
        env:
          INVOCATION_ACTION: ${{ github.event.action }}
          INVOCATION_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          INVOCATION_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/checkpoint_report.py capture --scope "PR integration checkout" \
            --output .artifacts/checkpoint/context.json
          cat .artifacts/checkpoint/context.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        id: dependencies
      - run: npm run build
        id: build
      - run: npm run lint
        id: lint
      - run: npm run test:coverage
        id: unit_tests
      - run: npm run validate:migrations
        id: migrations
      - run: python3 .proof/validators/validate_repository.py
        id: repository
      - name: Checkpoint report regressions
        id: checkpoint_tests
        run: python3 -m unittest discover -s scripts/tests -p test_checkpoint_report.py
      - run: npx playwright install --with-deps chromium
        id: browser_setup
      - run: npm run test:e2e
        id: e2e
      - id: application_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: acceptance-evidence
          path: |
            playwright-report/
            test-results/
            coverage/
          retention-days: 14
      - name: Summarize SDLC checkpoint
        if: ${{ always() && steps.checkpoint_context.outcome == 'success' }}
        continue-on-error: true
        env:
          CHECKPOINT_STEPS: ${{ toJSON(steps) }}
          CHECKPOINT_JOB_STATUS: ${{ job.status }}
        run: |
          python3 scripts/checkpoint_report.py render \
            --context .artifacts/checkpoint/context.json --config scripts/checkpoint-report.json \
            --output-dir .artifacts/checkpoint
      - name: Retain SDLC checkpoint report
        if: ${{ always() && steps.checkpoint_context.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/checkpoint/
          if-no-files-found: warn
          retention-days: 14
